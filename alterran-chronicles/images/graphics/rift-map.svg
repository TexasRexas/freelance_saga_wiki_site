<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="title desc">
<title id="title">Stylized Map of Alterra</title>
<desc id="desc">A self-created abstract map showing Union City, the Riftlands, Highwind, and western seas.</desc>
<rect width="700" height="420" fill="#0B1220"/>
<path d="M80 290 C140 200, 220 240, 260 120 C350 90, 390 160, 480 110 C560 150, 590 230, 650 275 L620 380 L120 370 Z" fill="#1E293B" stroke="#22D3EE" stroke-width="4"/>
<ellipse cx="350" cy="220" rx="80" ry="115" fill="#3B82F6" opacity=".28" stroke="#8B5CF6" stroke-width="5"/>
<circle cx="310" cy="285" r="12" fill="#F59E0B"/>
<text x="330" y="292" fill="#F8FAFC" font-family="Arial" font-size="20">Union City</text>
<circle cx="515" cy="130" r="12" fill="#10B981"/>
<text x="535" y="137" fill="#F8FAFC" font-family="Arial" font-size="20">Highwind</text>
<text x="303" y="218" fill="#D1D5DB" font-family="Arial" font-size="24">Riftlands</text>
<path d="M20 50 C80 75, 90 25, 150 50 S240 72, 280 45" fill="none" stroke="#22D3EE" stroke-width="4" opacity=".55"/>
<text x="35" y="92" fill="#D1D5DB" font-family="Arial" font-size="20">Western Seas</text>
</svg>